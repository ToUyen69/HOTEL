<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác nhận đặt phòng — The Forest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="Public/logo KS.png" alt="The Forest Logo">
      </a>
      <nav class="nav" id="main-nav">
        <a href="index.html">Trang chủ</a>
        <a href="rooms.html">Phòng</a>
        <a href="services.html">Dịch vụ</a>
        <a href="about.html">Về chúng tôi</a>
        <a href="travel-guide.html">Cẩm nang</a>
        <a href="my-booking.html">Đặt phòng của tôi</a>      </nav>
      <div class="header-actions" id="header-actions"></div>
      <button class="mobile-toggle" id="mobile-toggle">☰</button>
    </div>
  </div>
</header>

<section class="section">
  <div class="container" style="max-width:720px">
    <div id="confirm-content">
      <div class="empty-state"><div class="empty-state-icon">⏳</div><p>Đang tải...</p></div>
    </div>
  </div>
</section>

<footer class="footer"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
function render() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const b  = id ? KSAN.getBookingById(id) : null;

  const el = document.getElementById('confirm-content');
  if (!b) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon"><img src="Public/icon/info.png" style="width:56px;opacity:.3"></div>
        <h3>Không tìm thấy đặt phòng</h3>
        <p>Mã đặt phòng không tồn tại hoặc đã hết hạn.</p>
        <a href="index.html" class="btn btn-primary mt-16">Về trang chủ</a>
      </div>`;
    return;
  }

  const room   = KSAN.ROOMS.find(r => r.id === b.roomId);
  const nights = b.nights;
  const remaining = b.totalPrice - b.deposit;

  el.innerHTML = `
    <!-- Success Banner -->
    <div class="confirm-hero" style="border-radius:var(--radius-lg);margin-bottom:24px">
      <div class="confirm-icon"><img src="Public/icon/success.png" style="width:40px;height:40px;filter:invert(1)"></div>
      <h2 style="margin-bottom:8px">Đặt phòng thành công!</h2>
      <p style="color:var(--text-light);margin-bottom:16px">
        Cảm ơn bạn đã tin tưởng The Forest. Xác nhận đã được gửi đến email <strong>${b.guestEmail}</strong>.
      </p>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap">
        <span class="badge badge-green" style="font-size:.9rem;padding:6px 16px">Đã xác nhận</span>
        <span style="color:var(--text-light);font-size:.85rem">Mã đặt phòng:</span>
        <code style="background:var(--primary-pale);color:var(--primary);padding:6px 14px;border-radius:8px;font-size:1rem;font-weight:700;letter-spacing:1px">${b.id}</code>
      </div>
    </div>

    <!-- Main card -->
    <div class="card" style="margin-bottom:20px">
      <div style="display:grid;grid-template-columns:180px 1fr;gap:0;overflow:hidden">
        <div style="overflow:hidden">
          <img src="${b.roomImage}" alt="${b.roomName}" style="width:100%;height:100%;object-fit:cover;min-height:160px">
        </div>
        <div style="padding:20px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <h3 style="margin:0">${b.roomName}</h3>
            <span class="badge badge-gold">${room ? room.type : ''}</span>
          </div>
          <div class="booking-detail-grid">
            <div class="detail-item">
              <label>Nhận phòng</label>
              <span>${KSAN.formatDate(b.checkIn)} — 14:00</span>
            </div>
            <div class="detail-item">
              <label>Trả phòng</label>
              <span>${KSAN.formatDate(b.checkOut)} — 12:00</span>
            </div>
            <div class="detail-item">
              <label>Số đêm</label>
              <span>${nights} đêm</span>
            </div>
            <div class="detail-item">
              <label>Số khách</label>
              <span>${b.guests} khách</span>
            </div>
            <div class="detail-item">
              <label>Khách hàng</label>
              <span>${b.guestName}</span>
            </div>
            <div class="detail-item">
              <label>Số điện thoại</label>
              <span>${b.guestPhone}</span>
            </div>
          </div>
          ${b.specialReq ? `<div style="margin-top:10px;font-size:.82rem;color:var(--text-light)">Yêu cầu đặc biệt: ${b.specialReq}</div>` : ''}
        </div>
      </div>
    </div>

    <!-- Invoice Summary -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-body">
        <h4 style="margin-bottom:16px">Chi tiết thanh toán</h4>
        <div class="summary-line">
          <span>Giá phòng (${nights} đêm × ${KSAN.formatCurrency(room ? room.price : 0)})</span>
          <span>${KSAN.formatCurrency(b.basePrice)}</span>
        </div>
        ${b.discount > 0 ? `
        <div class="summary-line">
          <span style="color:var(--success)">Giảm giá (${b.promoCode})</span>
          <span style="color:var(--success)">−${KSAN.formatCurrency(b.discount)}</span>
        </div>` : ''}
        <div class="summary-line total">
          <span>Tổng cộng</span>
          <span>${KSAN.formatCurrency(b.totalPrice)}</span>
        </div>
        <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div style="background:var(--primary-pale);padding:14px;border-radius:10px;text-align:center">
            <div style="font-size:.75rem;color:var(--text-light);margin-bottom:4px">ĐÃ THANH TOÁN (cọc 30%)</div>
            <div style="font-size:1.2rem;font-weight:700;color:var(--primary)">${KSAN.formatCurrency(b.deposit)}</div>
          </div>
          <div style="background:#f8f8f8;padding:14px;border-radius:10px;text-align:center">
            <div style="font-size:.75rem;color:var(--text-light);margin-bottom:4px">THANH TOÁN KHI CHECK-IN</div>
            <div style="font-size:1.2rem;font-weight:700;color:var(--secondary)">${KSAN.formatCurrency(remaining)}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Policy -->
    <div class="card" style="margin-bottom:24px">
      <div class="card-body">
        <h4 style="margin-bottom:14px">Chính sách hủy phòng của bạn</h4>
        <div style="display:flex;flex-direction:column;gap:8px;font-size:.85rem">
          <div style="display:flex;align-items:center;gap:10px;padding:8px;background:var(--primary-pale);border-radius:8px">
            <span style="color:var(--success);font-weight:700">✓</span>
            <span>Hủy miễn phí trước <strong>${KSAN.formatDate(new Date(new Date(b.checkIn).getTime() - 48*60*60*1000))}</strong> (trước 48h nhận phòng)</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px;background:#fef9e7;border-radius:8px">
            <span style="color:var(--warning);font-weight:700">⚠</span>
            <span>Hủy 24–48h trước: Phạt <strong>30%</strong> = ${KSAN.formatCurrency(Math.round(b.deposit * 0.3))} tiền cọc</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px;background:#fdecea;border-radius:8px">
            <span style="color:var(--danger);font-weight:700">✗</span>
            <span>Hủy trong vòng 24h: Mất <strong>100%</strong> tiền cọc = ${KSAN.formatCurrency(b.deposit)}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <a href="my-booking.html" class="btn btn-primary btn-lg"><img src="Public/icon/invoice.png" style="height:14px;vertical-align:middle;filter:invert(1);margin-right:4px"> Xem đặt phòng của tôi</a>
      <a href="index.html" class="btn btn-outline btn-lg">Về trang chủ</a>
      <button class="btn btn-outline" onclick="window.print()"><img src="Public/icon/printer.png" style="height:14px;vertical-align:middle;opacity:.75;margin-right:4px"> In xác nhận</button>
    </div>`;
}

render();
</script>
<script src="js/footer.js"></script>
</body>
</html>
